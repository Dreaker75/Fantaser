<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/main.css">
  <title>Fantaser</title>
</head>

<body>
  <template id="resource-display-template">
    <div class="col-2 col-lg-3 col-md-4 col-sm-6 col-12 resource-display" data-resource="">
      <img class="resource-icon" name="resource-display-icon" src="images/" alt="">
      <span name="resource-display-value"></span>
    </div>
  </template>
  <template id="resource-generation-template">
    <div class="col-2 col-lg-3 col-md-4 col-sm-6 col-12 py-3 resource-generation" data-resource="">
      <h2 name="resource-h2"></h2>
      <h3>Level <span class="rift-level">0</span></h3>
      <div class="grid">
        <div class="row py-3">
          <div>
            <img class="clickable" src="images/" alt="">
          </div>
        </div>
      </div>
      <button type="button" name="level-up-button" data-bs-toggle="modal" data-bs-target="#resources-check-modal">Level Up</button>
    </div>
  </template>
  <template id="element-storage-template">
    <div class="element-capacity-div" data-element="">
      <h4 class="element-name">ELEMENT NAME</h4>
      <div class="container">
        <div class="resources-div row">
        </div>
      </div>
    </div>
  </template>
  <template id="resource-storage-template">
    <div class="col-md-3 col-sm-6 col-12 p-1">
      <div class="resource-capacity-div" data-resource="">
        <h5 class="resource-name">RESOURCE NAME</h5>
        <p class="resource-max-amount">1000000</p>
      </div>
    </div>
  </template>
  <template id="resource-craft-template">
    <div class="col-2 col-lg-3 col-md-4 col-sm-6 col-12 p-1 resource-craft-div" data-resource="">
      <h2 name="resource-name">RESOURCE NAME</h2>
      <img src="images/" alt="Image here">
      <p>Owned: <span name="resource-amount-owned">X</span></p>
      <div class="craft-requirements-div">
      </div>
      <button type="button" name="craft-button">Craft</button>
    </div>
  </template>
  <template id="resource-requirement-template">
    <p class="resource-requirement-div"><img src="images/" alt="">
      <span class="fulfilled-icon">X</span> <span class="resource-name">RESOURCE NAME</span>:
      <span class="resource-amount">XXX</span>/<span class="resource-amount-required">XXX</span>
    </p>
  </template>
  <header>
    <div class="row m-1 justify-content-center" id="resources-display">
    </div>
    <nav>
      <button id="rifts-menu-button">Rifts</button>
      <button id="player-menu-button">Player</button>
      <button id="craft-menu-button">Craft</button>
    </nav>
  </header>
  <main>
    <div id="rifts-menu">
      <div class="row justify-content-center text-center" id="resources-generation">
      </div>
    </div>
    <div id="player-menu">
      <div id="player-level-info">
        <h1>Level <span class="player-level">1</span></h1>
        <div id="player-level-up-info">
          <button type="button" name="level-up-button" data-bs-toggle="modal" data-bs-target="#resources-check-modal">Level Up</button>
        </div>
      </div>
      <div id="storage">
        <h3>Resources Capacity</h3>
      </div>
    </div>
    <div id="craft-menu">
      <h1>Crafting Desk</h1>
      <div id="crafting-list-div" class="row justify-content-center text-center">
      </div>
    </div>
    <!-- Modal used to check if the player has enough resources to level up, craft, etc -->
    <div id="resources-check-modal" class="modal fade">
      <div class="modal-dialog text-center">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">FILL OUT THE MODAL TITLE</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <button id="modal-button-check-successful" disabled>FILL OUT THE BUTTON'S TEXT</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
  <script type="module" src="src/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
