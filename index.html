<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/main.css">
  <title>Fantaser</title>
</head>

<body>
  <template id="resource-display-template">
    <div class="col-2 col-lg-3 col-md-4 col-sm-6 col-12 resource-display" data-resource="">
      <img class="resource-icon" name="resource-display-icon" src="images/" alt="">
      <span name="resource-display-value"></span>
    </div>
  </template>
  <template id="resource-generation-template">
    <div class="col-2 col-lg-3 col-md-4 col-sm-6 col-12 py-3 resource-generation" data-resource="">
      <h2 name="resource-h2"></h2>
      <div class="grid">
        <div class="row py-3">
          <div>
            <img src="images/" alt="Shrine image">
          </div>
        </div>
      </div>
      <button name="resource-button">Generate</button>
    </div>
  </template>
  <div class="row m-1 justify-content-center" id="resources-display">
  </div>
  <div class="row justify-content-center text-center" id="resources-generation">
  </div>
  <script type="module" src="src/main.js"></script>
</body>

</html>
